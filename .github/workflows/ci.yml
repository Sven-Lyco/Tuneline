name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Prettier, ESLint, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # The runner's cached Node.js can be older than the patched release that
          # engines.node (engine-strict) requires; always resolve the newest one
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npx prettier --check "client/src/**/*.{ts,tsx}"

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fails below 80 % statements/branches/functions/lines (thresholds in the Vitest configs)
      - name: Tests & Coverage
        run: npm run coverage
