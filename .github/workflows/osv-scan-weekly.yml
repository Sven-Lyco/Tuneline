name: OSV-Scanner (Weekly Full Repo)

on:
  # Jeden Donnerstag um 06:00 UTC
  # (Winter: 07:00 in Deutschland, Sommer: 08:00)
  schedule:
    - cron: '0 6 * * 4'

  # Optional: manuell im UI auslösbar
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ubuntu-latest

    outputs:
      osv_exit_code: ${{ steps.osv.outputs.OSV_EXIT_CODE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OSV-Scanner
        run: |
          echo "📥 Installing OSV-Scanner..."
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: Scan entire repository with OSV-Scanner
        id: osv
        run: |
          echo "🚀 Scanning complete repo (rekursiv) mit OSV-Scanner..."
          set +e

          # Table format for human-readable log artifact
          osv-scanner -r . 2>&1 | tee osv-scan.log
          EXIT_CODE=${PIPESTATUS[0]}

          # JSON format for severity filtering (jq is pre-installed on ubuntu-latest)
          osv-scanner -r . --format json > osv-scan.json 2>/dev/null || true

          echo "OSV_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Auswertung & Build ggf. fehlschlagen lassen
        run: |
          EXIT_CODE=${{ steps.osv.outputs.OSV_EXIT_CODE }}

          echo "--------------------------------------------------"
          echo "🕒 Wöchentlicher OSV-Scan – Exit-Code: $EXIT_CODE"
          echo "--------------------------------------------------"
          echo "Log-Auszug (letzte 50 Zeilen):"
          echo "--------------------------------------------------"
          tail -n 50 osv-scan.log || echo "Keine Log-Datei gefunden."

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "🎉 OSV-Weekly Scan: Keine bekannten Schwachstellen gefunden."
            exit 0
          fi

          if [ "$EXIT_CODE" -ne 1 ]; then
            echo "::error::OSV-Scanner Fehler (Exit-Code $EXIT_CODE)."
            exit 1
          fi

          # Exit code 1 = Schwachstellen gefunden — nur bei HIGH/CRITICAL fehlschlagen
          HIGH_CRIT=$(jq '[.results[].packages[].vulnerabilities[] | .database_specific.severity // "" | select(. == "HIGH" or . == "CRITICAL")] | length' osv-scan.json 2>/dev/null || echo "0")

          if [ "$HIGH_CRIT" -gt 0 ]; then
            echo "::error::OSV-Scanner hat $HIGH_CRIT HIGH/CRITICAL Schwachstellen gefunden!"
            exit 1
          else
            echo "⚠️ OSV-Scanner: Schwachstellen gefunden, aber keine HIGH/CRITICAL – kein Fehler."
          fi

      - name: Vollständiges OSV-Log als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan-log-weekly
          path: |
            osv-scan.log
            osv-scan.json

  notify-telegram:
    needs: osv-scan
    # Immer laufen, egal ob der Scan-Job erfolgreich oder failed ist
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram secrets
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is not set."
            exit 1
          fi

      - name: Send Telegram notification
        run: |
          JOB_RESULT="${{ needs.osv-scan.result }}"

          if [ "$JOB_RESULT" = "failure" ]; then
            STATUS="🚨 OSV-Weekly-Scan FEHLGESCHLAGEN (HIGH/CRITICAL gefunden)."
          elif [ "$JOB_RESULT" = "success" ]; then
            STATUS="✅ OSV-Weekly-Scan OK – keine HIGH/CRITICAL Schwachstellen."
          else
            STATUS="⚠️ OSV-Weekly-Scan: unbekannter Status ($JOB_RESULT)."
          fi

          MESSAGE="$STATUS%0ARepo: $GITHUB_REPOSITORY%0ACommit: $GITHUB_SHA%0ARun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE"
